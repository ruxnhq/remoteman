[workspace]
resolver = "3"
members = ["crates/*"]
# Not members: Windows-only, and used by path from the Windows crates that need them.
exclude = ["vendor/windows-reactor", "vendor/windows-rs"]

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
debug = 1

# The Windows apps (crates/remoteman-*-app-windows, the host's installer) are WinUI 3 through
# Microsoft's windows-reactor at windows-rs commit 63a5e3d, vendored with patches
# (vendor/windows-reactor/VENDORED.md) beside the windows-rs crates it needs (vendor/windows-rs),
# so that no build anywhere fetches the windows-rs repository.
