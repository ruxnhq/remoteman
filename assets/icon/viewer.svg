<?xml version="1.0" encoding="UTF-8"?>
<!-- The viewer's app icon ("Slipstream", chosen by the owner on 2026-11-17), full bleed on a
     1024 grid: a display leaning into motion with the picture arriving from the left, white on
     #2458F5. The master for every platform: Apple's icons are cut from it as it is (the system
     rounds the corners); the Linux icon is the same drawing inside a rounded tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#2458F5"/>
  <g transform="translate(532 512) skewX(-14) translate(-512 -512)" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round">
    <rect x="372" y="282" width="500" height="356" rx="72"/>
    <path d="M512 744h220"/>
    <path d="M150 362h120" opacity=".95"/>
    <path d="M96 460h174" opacity=".7"/>
    <path d="M186 558h84" opacity=".45"/>
  </g>
</svg>
