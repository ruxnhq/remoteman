# The remoteman viewer for macOS and for iPad/iPhone: one set of Swift sources (Shared/) on the
# Rust client core (build/RemotemanCore.xcframework, made by ./build-core.sh).
# Generate the Xcode project with `xcodegen` here, then build with xcodebuild (see README.md).
name: Remoteman
options:
  bundleIdPrefix: com.xnixy.remoteman
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R82PLAJ45H
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
targets:
  RemotemanMac:
    type: application
    platform: macOS
    sources: [Shared, Mac]
    dependencies:
      - framework: build/RemotemanCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    info:
      path: Support/Mac-Info.plist
      properties:
        CFBundleDisplayName: remoteman
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: remoteman connects to your PC on the local network to show and control its desktop.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnixy.remoteman.viewer
        PRODUCT_NAME: remoteman
        ENABLE_HARDENED_RUNTIME: YES
  Remoteman:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    dependencies:
      - framework: build/RemotemanCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: remoteman
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: remoteman connects to your PC on the local network to show and control its desktop.
        # 120 Hz on iPhones with ProMotion; iPads need nothing.
        CADisableMinimumFrameDurationOnPhone: true
        # Clicks and drags from a trackpad or mouse arrive as pointer events, not fake touches.
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIFileSharingEnabled: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnixy.remoteman
        PRODUCT_NAME: remoteman
        TARGETED_DEVICE_FAMILY: "1,2"
  # The Mac as a host. An app with no Dock icon or window, so that macOS files its Screen
  # Recording and Accessibility grants under its own name; it logs to
  # ~/Library/Logs/remoteman-host.log and takes the options in Host/main.swift.
  RemotemanHost:
    type: application
    platform: macOS
    sources:
      - Host
      - Shared/HIDKeys.swift
    dependencies:
      - framework: build/RemotemanCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: VideoToolbox.framework
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: remoteman host
        LSUIElement: true
        NSLocalNetworkUsageDescription: remoteman host lets your own devices connect to this Mac to show and control its desktop.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xnixy.remoteman.host
        PRODUCT_NAME: remoteman-host
        SWIFT_OBJC_BRIDGING_HEADER: Host/Bridging.h
        ENABLE_HARDENED_RUNTIME: YES
