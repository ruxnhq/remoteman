[package]
name = "remoteman-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The wire format (docs/PROTOCOL.md): types and framing only, no I/O.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
