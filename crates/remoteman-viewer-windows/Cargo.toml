[package]
name = "remoteman-viewer-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# remoteman for Windows: a Win32 window and Direct3D 11 on the shared core. Everything it needs
# is Windows-only, so on other systems the crate is an empty program and the workspace builds as
# before.
# Not "remoteman": the Linux viewer's program has that name, and a workspace build on Linux puts
# both in target/release, where the empty one could land on top of the real one. Whatever
# packages the Windows app ships this as remoteman.exe.
[[bin]]
name = "remoteman-windows"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
remoteman-core = { path = "../remoteman-core" }
anyhow = "1"
png = "0.18"
serde_json = "1"
windows-numerics = "0.3"
# The raw bindings: the D3D11VA hardware frames need FFmpeg's C structures, which the safe
# wrapper doesn't reach.
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
