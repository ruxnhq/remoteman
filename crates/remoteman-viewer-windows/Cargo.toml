[package]
name = "remoteman-viewer-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Windows viewer's engine, and the old program on it (remoteman-windows.exe: a Win32 window
# with an interface drawn by itself, Direct3D 11 on the shared core; kept for its tests,
# --vrr-probe among them). The app people use is crates/remoteman-viewer-app-windows (WinUI 3
# through windows-reactor), which links the engine and ships as remoteman.exe. Everything here
# is Windows-only, so on other systems the crate is an empty program and the workspace builds as
# before. Not "remoteman": the Linux viewer's program has that name, and Cargo refuses two
# programs of one name in a workspace build.
# The engine behind the app (crates/remoteman-viewer-app-windows, WinUI 3 through
# windows-reactor), which links it as a Rust library: sessions, decode, presentation, input,
# sound, clipboard, files, the store, behind the interface in src/engine.rs. On other systems
# it is empty.
[lib]
name = "remoteman_engine"
path = "src/lib.rs"

[[bin]]
name = "remoteman-windows"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
remoteman-core = { path = "../remoteman-core" }
# The microphone: the Linux viewer's Opus settings and framer (on Windows that crate is its
# Opus half only, with libopus built from the copy opusic-c carries).
remoteman-audio = { path = "../remoteman-audio" }
anyhow = "1"
png = "0.18"
serde_json = "1"
windows-numerics = "0.3"
# The raw bindings: the D3D11VA hardware frames need FFmpeg's C structures, which the safe
# wrapper doesn't reach.
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Finding computers (DNS-SD), waking them (each network's broadcast), the camera (Media
    # Foundation) and touches (pointer input; injected in the tests).
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_UI_Input_Pointer",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }
