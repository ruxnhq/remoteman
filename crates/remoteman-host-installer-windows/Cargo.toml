[package]
name = "remoteman-host-installer-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# remoteman's installers for Windows, one engine (the library, src/lib.rs) and a program for each
# product: the host's, one downloadable file, remoteman-host-setup-VERSION.exe, and the
# uninstaller Settings > Apps runs; and the viewer's, remoteman-viewer-setup-VERSION.exe, for
# those who want the viewer without the Store. Their pages are WinUI 3 through Microsoft's
# windows-reactor (vendor/windows-reactor); the files each installs, and the Windows App Runtime
# its pages need, are packed into the exe itself (src/archive.rs). It holds no rule of the host's:
# the host's system steps are windows/host-installer/setup.ps1's, which it only runs. src/lib.rs
# says how the one file becomes the processes it runs as. Everything it needs is Windows-only, so
# on other systems this crate builds to a stub.
[lib]
name = "remoteman_setup"
path = "src/lib.rs"
# The indented command lines in its documentation are command lines, not Rust.
doctest = false

[[bin]]
name = "remoteman-host-setup"
path = "src/main.rs"

[[bin]]
name = "remoteman-viewer-setup"
path = "src/viewer.rs"

[target.'cfg(windows)'.dependencies]
windows-reactor = { path = "../../vendor/windows-reactor" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The packed files: XZ (LZMA2 behind the x86 branch filter), pure Rust, Apache-2.0.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
# Stages the Windows App Runtime beside the exe and embeds the manifest that finds it there; the
# installer packs those files into itself (scripts/win-host-setup.ps1).
windows-reactor-setup = { path = "../../vendor/windows-rs/reactor-setup" }
# The exe's icon and its name in Windows (the UAC prompt shows it).
winresource = "0.1"
