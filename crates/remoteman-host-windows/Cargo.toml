[package]
name = "remoteman-host-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Windows host: streams a monitor of an indirect display driver and takes the client's
# input. The connection itself is the shared core's host role. Everything it needs is
# Windows-only, so on other systems this crate builds to a stub.
[[bin]]
name = "remoteman-host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
remoteman-core = { path = "../remoteman-core" }
remoteman-encode = { path = "../remoteman-encode" }
remoteman-vcam-windows = { path = "../remoteman-vcam-windows" }
anyhow = "1"
serde_json = "1"
# Opus as the Linux host sends it. The default features build libopus from the copy the crate
# carries (with cmake, which cargo-xwin points at clang-cl), since Windows has no system libopus.
opusic-c = "1.6"
# Pictures on the clipboard travel as PNG.
png = "0.18"
tracing = "0.1"
tracing-subscriber = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_XboxController",
    "UI_Input_Preview_Injection",
    "Gaming_Input",
    "Foundation_Collections",
    "Win32_UI_Controls",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Pipes",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
] }
