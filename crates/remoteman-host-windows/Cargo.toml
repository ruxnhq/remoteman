[package]
name = "remoteman-host-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Windows host: streams a monitor of an indirect display driver and takes the client's
# input. The connection itself is the shared core's host role. Everything it needs is
# Windows-only, so on other systems this crate builds to a stub.
[[bin]]
name = "remoteman-host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
remoteman-core = { path = "../remoteman-core" }
remoteman-encode = { path = "../remoteman-encode" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Controls",
    "Win32_Media",
] }
