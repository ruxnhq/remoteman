[package]
name = "remoteman-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# QUIC between a client and a host, with both sides pinned by certificate fingerprint.
[dependencies]
remoteman-proto = { path = "../remoteman-proto" }
anyhow = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
