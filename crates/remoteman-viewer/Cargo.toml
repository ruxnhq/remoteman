[package]
name = "remoteman-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# remoteman for Linux: a GTK 4 viewer on the shared core.
[[bin]]
name = "remoteman"
path = "src/main.rs"

[dependencies]
remoteman-core = { path = "../remoteman-core" }
remoteman-audio = { path = "../remoteman-audio" }
anyhow = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }

[build-dependencies]
cc = "1"
