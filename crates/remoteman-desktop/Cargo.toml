[package]
name = "remoteman-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# What a host's desktop must provide: a display made for the client, and a way to put input in.
# GNOME (Mutter) is the first backend.
[dependencies]
remoteman-proto = { path = "../remoteman-proto" }
anyhow = "1"
futures-util = "0.3"
# net and io-util: the clipboard's content goes through pipes.
tokio = { version = "1", features = ["time", "rt", "sync", "net", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
