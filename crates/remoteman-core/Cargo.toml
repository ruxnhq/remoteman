[package]
name = "remoteman-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The shared core, with a client role and a host role: everything about the connection, so the
# programs around it only deal with pictures and input. A Rust API, and the same thing as a C
# interface (include/remoteman_core.h) for Swift and other languages.
[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
remoteman-proto = { path = "../remoteman-proto" }
remoteman-transport = { path = "../remoteman-transport" }
anyhow = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
