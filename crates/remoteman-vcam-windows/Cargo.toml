[package]
name = "remoteman-vcam-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Windows: a device's camera as a camera on this PC (Windows 11's virtual camera). Two halves:
#
# - the DLL (cdylib): a Media Foundation media source that the Frame Server loads, as a COM
#   in-process server, whenever a program opens "remoteman camera". It shows what it finds in a
#   shared-memory ring, black when there is nothing. It depends on `windows` alone: it lives in
#   a service's process (svchost), which has no ffmpeg and no remoteman beside it.
# - the library (rlib), which the host uses: the ring's writer, and MFCreateVirtualCamera.
#
# On other systems this crate is empty.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
] }
