[package]
name = "windows-window"
version = "0.101.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows windowing library"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[dependencies]
windows-core = { version = "0.101.0", path = "../core", default-features = false }


[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[lints.rust]
unexpected_cfgs = { level = 'warn', check-cfg = ['cfg(windows_slim_errors, windows_cast_diagnostics)'] }
