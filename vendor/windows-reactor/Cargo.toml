# windows-reactor from windows-rs 63a5e3d, patched (see VENDORED.md): Mica and Acrylic stay in
# their active look while the window is not in front, more theme brushes, and notifications from a
# notification icon. Used through the workspace's [patch] of the windows-rs git source.
[package]
name = "windows-reactor"
version = "0.101.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Declarative Windows UI library for Rust"
repository = "https://github.com/microsoft/windows-rs"
publish = false

[dependencies]
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false, features = ["std"] }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false }
windows-future = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false }
windows-reference = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false, features = ["std"] }
windows-threading = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false }
windows-time = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false }
windows-window = { git = "https://github.com/microsoft/windows-rs", rev = "63a5e3d9b9afbd57c382d0a4f5a367f134e9dc25", default-features = false }

# Upstream takes its lints from the windows-rs workspace. `dead_code`: the first patch leaves
# WinUI's own backdrop bindings unused.
[lints.rust]
dead_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_cast_diagnostics)'] }
